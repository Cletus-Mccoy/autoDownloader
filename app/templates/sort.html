<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sort liked tracks — YT Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6">

    <div class="flex items-center justify-between mb-1">
        <h1 class="text-xl font-semibold">Sort liked tracks</h1>
        <a href="/" class="text-sm text-indigo-400 hover:text-indigo-300">← Downloader</a>
    </div>
    <p class="text-sm text-gray-500 mb-6">
        Tracks the sorter wasn't confident enough to place on its own. Pick a
        playlist and it's filed straight away — and becomes a training example,
        so these get rarer.
    </p>

    <div id="status" class="text-sm text-gray-500 mb-4">Loading…</div>
    <div id="queue" class="space-y-3"></div>

    <div id="empty" class="hidden text-center py-16">
        <div class="text-4xl mb-3">✓</div>
        <div class="text-gray-300 font-medium">Queue is empty</div>
        <div class="text-sm text-gray-500 mt-1">
            Nothing waiting. New liked tracks appear here after the next sorter run.
        </div>
    </div>
</div>

<script>
let playlists = [];

async function load() {
    const res = await fetch('/api/sort/queue');
    const data = await res.json();
    playlists = data.playlists || [];
    render(data);
}

function render(data) {
    const queue = document.getElementById('queue');
    const tracks = data.tracks || [];
    document.getElementById('empty').classList.toggle('hidden', tracks.length > 0);
    document.getElementById('status').textContent = tracks.length
        ? `${tracks.length} track${tracks.length === 1 ? '' : 's'} waiting` +
          (data.generated_at ? ` · queued ${data.generated_at.slice(0, 16).replace('T', ' ')}` : '')
        : '';
    queue.innerHTML = '';
    tracks.forEach(t => queue.appendChild(card(t)));
}

function card(track) {
    const el = document.createElement('div');
    el.className = 'bg-gray-900 border border-gray-800 rounded-lg p-4';
    el.id = 'row-' + track.videoId;

    const options = (track.options || []).map(o => `
        <button onclick="assign('${track.videoId}', ${JSON.stringify(o.playlist).replace(/"/g, '&quot;')})"
                class="text-left px-3 py-2 rounded-md bg-gray-800 hover:bg-indigo-600
                       border border-gray-700 hover:border-indigo-500 transition
                       flex items-center justify-between gap-3 w-full">
            <span class="text-sm">${escapeHtml(o.playlist)}</span>
            <span class="text-xs text-gray-500 tabular-nums">${Math.round(o.confidence * 100)}%</span>
        </button>`).join('');

    const others = playlists
        .filter(p => !(track.options || []).some(o => o.playlist === p))
        .map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`)
        .join('');

    el.innerHTML = `
        <div class="mb-3">
            <div class="font-medium text-gray-100">${escapeHtml(track.title || '?')}</div>
            <div class="text-sm text-gray-500">${escapeHtml(track.artist || '?')}</div>
        </div>
        <div class="grid gap-2 mb-3">${options}</div>
        <div class="flex items-center gap-2">
            <select onchange="if(this.value) assign('${track.videoId}', this.value)"
                    class="flex-1 bg-gray-800 border border-gray-700 rounded-md px-2 py-1.5 text-sm">
                <option value="">Another playlist…</option>
                ${others}
            </select>
            <button onclick="skip('${track.videoId}')"
                    class="px-3 py-1.5 text-sm text-gray-400 hover:text-gray-200
                           border border-gray-700 rounded-md hover:bg-gray-800">
                Leave it
            </button>
            <a href="https://music.youtube.com/watch?v=${track.videoId}" target="_blank"
               class="px-3 py-1.5 text-sm text-gray-400 hover:text-indigo-300
                      border border-gray-700 rounded-md hover:bg-gray-800">Listen</a>
        </div>
        <div class="text-xs mt-2 h-4" id="msg-${track.videoId}"></div>`;
    return el;
}

async function assign(videoId, playlist) {
    const msg = document.getElementById('msg-' + videoId);
    msg.textContent = 'Adding…';
    msg.className = 'text-xs mt-2 h-4 text-gray-500';
    const res = await fetch('/api/sort/assign', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({videoId, playlist})
    });
    const data = await res.json();
    if (data.ok) { remove(videoId); } else {
        msg.textContent = data.error || 'Failed';
        msg.className = 'text-xs mt-2 h-4 text-red-400';
    }
}

async function skip(videoId) {
    await fetch('/api/sort/skip', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({videoId})
    });
    remove(videoId);
}

function remove(videoId) {
    const row = document.getElementById('row-' + videoId);
    if (row) row.remove();
    const left = document.querySelectorAll('#queue > div').length;
    document.getElementById('empty').classList.toggle('hidden', left > 0);
    document.getElementById('status').textContent = left
        ? `${left} track${left === 1 ? '' : 's'} waiting` : '';
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

load();
</script>
</body>
</html>
